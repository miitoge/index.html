<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Tracking Simple</title>
  
  <!-- AIライブラリ（Safari対応） -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 100vw; height: 100vh;
    }

    /* カメラ映像を全画面表示 */
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* トラッキング枠を描くキャンバス */
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="container">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<script>
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let model = null;

  // 1. カメラ起動
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { 
          facingMode: "environment",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });
      video.srcObject = stream;
      await new Promise((resolve) => { video.onloadeddata = () => resolve(); });
    } catch (e) {
      console.error("カメラ起動エラー", e);
    }
  }

  // 2. リアルタイム・トラッキング描画処理
  async function predictLoop() {
    if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    if (model && video.readyState === 4) {
      // 検出感度を少し上げて（0.35以上）細かく探す
      const predictions = await model.detect(video, 10, 0.35);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const cw = canvas.width;
      const ch = canvas.height;

      const videoRatio = vw / vh;
      const canvasRatio = cw / ch;

      let renderWidth, renderHeight, offsetX, offsetY;

      if (canvasRatio > videoRatio) {
        renderWidth = cw;
        renderHeight = cw / videoRatio;
        offsetX = 0;
        offsetY = (ch - renderHeight) / 2;
      } else {
        renderWidth = ch * videoRatio;
        renderHeight = ch;
        offsetX = (cw - renderWidth) / 2;
        offsetY = 0;
      }

      const scaleX = renderWidth / vw;
      const scaleY = renderHeight / vh;

      // 画面全体に対するサイズの割合を計算して「巨大すぎる枠（棚全体）」を除外するフィルタリング
      const validObjects = predictions.filter(obj => {
        const areaRatio = (obj.bbox[2] * obj.bbox[3]) / (vw * vh);
        // 画面の50%以上を占める枠（棚や人間など）は除外
        return areaRatio < 0.50;
      });

      // 検出された商品（最大3つまで）に枠を描画
      const targets = validObjects.slice(0, 3);

      targets.forEach(obj => {
        const x = obj.bbox[0] * scaleX + offsetX;
        const y = obj.bbox[1] * scaleY + offsetY;
        const w = obj.bbox[2] * scaleX;
        const h = obj.bbox[3] * scaleY;

        // --- トラッキング枠（メイン：ピンク） ---
        ctx.strokeStyle = '#ff00ff';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, w, h);

        // --- AR角枠アクセント（シアン） ---
        const len = Math.min(w, h) * 0.25;
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 4;

        ctx.beginPath(); ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + w - len, y); ctx.lineTo(x + w); ctx.lineTo(x + w, y + len); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, y + h - len); ctx.lineTo(x, y + h); ctx.lineTo(x + len, y + h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + w - len, y + h); ctx.lineTo(x + w); ctx.lineTo(x + w, y + h - len); ctx.stroke();
      });
    }
    requestAnimationFrame(predictLoop);
  }

  // アプリ起動
  async function main() {
    await startCamera();
    try {
      model = await cocoSsd.load();
    } catch (e) {
      console.error("AIモデル読み込みエラー", e);
    }
    predictLoop();
  }

  window.onload = main;
</script>

</body>
</html>

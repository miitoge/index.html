<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Tracking Shopping</title>
  
  <!-- AIライブラリ（TensorFlow.js + COCO-SSD） -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #000; color: white;
      font-family: sans-serif;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 100vw; height: 100vh;
    }

    /* カメラ映像を全画面表示 */
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* トラッキング枠を描く透明キャンバス */
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    /* 上部ステータス */
    .status-bar {
      position: absolute;
      top: 15px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: #00ffcc;
      z-index: 10;
      border: 1px solid #00ffcc;
    }

    /* ARオーバーレイ（最初のモックアップ画像再現） */
    .ar-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 3;
      pointer-events: none;
      display: none;
    }

    /* 左：口コミ */
    .review-panel {
      position: absolute;
      top: 70px; left: 10px;
      width: 44%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      padding: 8px;
      font-size: 11px;
    }
    .review-panel h3 { margin: 0 0 4px 0; font-size: 12px; color: #fff; border-bottom: 1px solid #555; }
    .pos { color: #4caf50; font-weight: bold; margin-top: 4px; }
    .neg { color: #ff5252; font-weight: bold; margin-top: 6px; }
    p { margin: 2px 0; color: #ddd; font-size: 10px; }

    /* 右：情報＆比較 */
    .info-panel {
      position: absolute;
      top: 70px; right: 10px;
      width: 48%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      padding: 8px;
      font-size: 11px;
    }
    .title-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #555; padding-bottom: 4px; }
    .title-row h2 { margin: 0; font-size: 12px; }
    .stars { color: #ffd700; font-size: 9px; }

    .compare-card {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #666;
      border-radius: 4px;
      padding: 4px;
      margin-top: 4px;
      display: flex; justify-content: space-between;
      font-size: 9px;
    }
    .compare-card.active { border-color: #ff00ff; background: rgba(255,0,255,0.2); }
  </style>
</head>
<body>

<div class="container">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="status-bar" id="status">🤖 AI準備中...（少々お待ちください）</div>

  <div class="ar-overlay" id="overlay">
    <div class="review-panel">
      <h3>▼ 口コミ</h3>
      <div class="pos">★ 肯定的なレビュー</div>
      <p id="pos-text">手軽で美味しい！満足度が高い。</p>
      <div class="neg">☆ 否定的なレビュー</div>
      <p id="neg-text">少し量が少なく感じるかも。</p>
    </div>

    <div class="info-panel">
      <div class="title-row">
        <h2 id="prod-name">チョコあ～んぱん</h2>
        <div class="stars">★★★★★</div>
      </div>
      <div style="font-size:10px; color:#ccc; margin-top:4px;">▼ 比較を選択</div>
      <div class="compare-card active">
        <span id="comp-1">チョコあ～んぱん</span><b>¥108</b>
      </div>
      <div class="compare-card">
        <span>たけのこの里</span><b>¥200</b>
      </div>
      <div class="compare-card">
        <span>コアラのマーチ</span><b>¥120</b>
      </div>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const overlayEl = document.getElementById('overlay');

  let model = null;

  // 1. カメラ起動
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" },
        audio: false
      });
      video.srcObject = stream;
      await new Promise((resolve) => { video.onloadeddata = () => resolve(); });
    } catch (e) {
      statusEl.innerText = "❌ カメラの起動に失敗しました";
    }
  }

  // 2. リアルタイム追従（ループ）
  async function predictLoop() {
    // キャンバスサイズを画面に合わせる
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    if (model && video.readyState === 4) {
      // AI物体検出の実行
      const predictions = await model.detect(video);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (predictions.length > 0) {
        statusEl.innerText = "🎯 ターゲットを追従中！";
        overlayEl.style.display = "block";

        // 一番確信度の高い物体を追従対象にする
        const obj = predictions[0];
        
        // 映像座標を画面座標に変換
        const scaleX = canvas.width / video.videoWidth;
        const scaleY = canvas.height / video.videoHeight;
        const x = obj.bbox[0] * scaleX;
        const y = obj.bbox[1] * scaleY;
        const w = obj.bbox[2] * scaleX;
        const h = obj.bbox[3] * scaleY;

        // --- 動くトラッキング枠（蛍光ピンク＆シアン）の描画 ---
        ctx.strokeStyle = '#ff00ff';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, w, h);

        // トラッキング感（AR角枠）の描画
        const len = 15;
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 4;
        // 左上
        ctx.beginPath(); ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
        // 右上
        ctx.beginPath(); ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len); ctx.stroke();
        // 左下
        ctx.beginPath(); ctx.moveTo(x, y + h - len); ctx.lineTo(x, y + h); ctx.lineTo(x + len, y + h); ctx.stroke();
        // 右下
        ctx.beginPath(); ctx.moveTo(x + w - len, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - len); ctx.stroke();

        // 検出したモノのラベルタグを表示
        ctx.fillStyle = '#ff00ff';
        ctx.fillRect(x, y - 22, w > 120 ? 120 : w, 22);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(obj.class, x + 5, y - 6);

        // 検出したモノに応じて表示テキストを変更
        updateText(obj.class);

      } else {
        statusEl.innerText = "🔍 モノ（ボトル、スマホ、本、カップ等）を映してください";
        overlayEl.style.display = "none";
      }
    }
    requestAnimationFrame(predictLoop);
  }

  // 表示情報の更新
  function updateText(label) {
    const name = document.getElementById('prod-name');
    const comp = document.getElementById('comp-1');
    const pos = document.getElementById('pos-text');

    if (label === 'bottle' || label === 'cup') {
      name.innerText = "コカ・コーラ";
      comp.innerText = "コカ・コーラ";
      pos.innerText = "キンキンに冷やすと最高！炭酸が強い。";
    } else {
      name.innerText = "チョコあ～んぱん";
      comp.innerText = "チョコあ～んぱん";
      pos.innerText = "一口サイズで食べやすい！サクサクで美味しい。";
    }
  }

  // アプリ起動
  async function main() {
    await startCamera();
    try {
      model = await cocoSsd.load();
      statusEl.innerText = "🔍 モノ（ボトル、スマホ、本等）を映してください";
    } catch (e) {
      statusEl.innerText = "❌ AIモデルの読み込みに失敗しました";
    }
    predictLoop();
  }

  window.onload = main;
</script>

</body>
</html>

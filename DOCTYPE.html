<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Object Detection</title>
  
  <!-- AIライブラリ（Safari対応） -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 100vw; height: 100vh;
    }

    /* カメラ映像を全画面表示 */
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* トラッキング枠と文字を描く透明キャンバス */
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 2;
      pointer-events: none; /* タッチイベントを下のvideoに通す */
    }
  </style>
</head>
<body>

<div class="container">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<script>
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let model = null;

  // 1. カメラ起動
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { 
          facingMode: "environment", // 背面カメラ
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });
      video.srcObject = stream;
      await new Promise((resolve) => { video.onloadeddata = () => resolve(); });
    } catch (e) {
      console.error("カメラ起動エラー", e);
      alert("カメラの起動に失敗しました。設定を確認してください。");
    }
  }

  // 2. リアルタイム・トラッキング＆描画処理
  async function predictLoop() {
    // キャンバスサイズを画面表示サイズに合わせる
    if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    if (model && video.readyState === 4) {
      // AI物体検出を実行（最大検出数:5, しきい値:0.4）
      const predictions = await model.detect(video, 5, 0.4);
      
      // 描画をクリア
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const cw = canvas.width;
      const ch = canvas.height;

      const videoRatio = vw / vh;
      const canvasRatio = cw / ch;

      let renderWidth, renderHeight, offsetX, offsetY;

      // object-fit: cover の計算
      if (canvasRatio > videoRatio) {
        renderWidth = cw;
        renderHeight = cw / videoRatio;
        offsetX = 0;
        offsetY = (ch - renderHeight) / 2;
      } else {
        renderWidth = ch * videoRatio;
        renderHeight = ch;
        offsetX = (cw - renderWidth) / 2;
        offsetY = 0;
      }

      const scaleX = renderWidth / vw;
      const scaleY = renderHeight / vh;

      // フィルタリング: でかすぎる枠（棚全体など）を除外 (画面面積の60%以上は除外)
      const validObjects = predictions.filter(obj => {
        const areaRatio = (obj.bbox[2] * obj.bbox[3]) / (vw * vh);
        return areaRatio < 0.60;
      });

      // 描画設定（フォントなど）
      ctx.font = 'bold 16px sans-serif';
      ctx.textBaseline = 'top';

      validObjects.forEach(obj => {
        // 認識した名前（英語）
        const label = obj.class.toUpperCase();
        
        // トラッキング座標を計算
        const x = obj.bbox[0] * scaleX + offsetX;
        const y = obj.bbox[1] * scaleY + offsetY;
        const w = obj.bbox[2] * scaleX;
        const h = obj.bbox[3] * scaleY;

        // --- 1. 四角いトラッキング枠（ピンク） ---
        ctx.strokeStyle = '#ff00ff';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, w, h);

        // --- 2. AR角枠アクセント（シアン） ---
        const len = Math.min(w, h) * 0.2; // 角枠の長さ
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y); ctx.stroke(); // 左上
        ctx.beginPath(); ctx.moveTo(x + w - len, y); ctx.lineTo(x + w); ctx.lineTo(x + w, y + len); ctx.stroke(); // 右上
        ctx.beginPath(); ctx.moveTo(x, y + h - len); ctx.lineTo(x, y + h); ctx.lineTo(x + len, y + h); ctx.stroke(); // 左下
        ctx.beginPath(); ctx.moveTo(x + w - len, y + h); ctx.lineTo(x + w); ctx.lineTo(x + w, y + h - len); ctx.stroke(); // 右下

        // --- 3. 認識した名前のテキスト表示（ピンク背景に白文字） ---
        const textWidth = ctx.measureText(label).width;
        const textHeight = 20; // ざっくりした高さ

        // 文字の背景を描画
        ctx.fillStyle = 'rgba(255, 0, 255, 0.8)';
        // 枠の左上に配置。枠からはみ出さないよう微調整
        ctx.fillRect(x, y - textHeight - 3, textWidth + 10, textHeight + 3);

        // 文字本体を描画
        ctx.fillStyle = '#ffffff'; // 白文字
        ctx.fillText(label, x + 5, y - textHeight);
      });
    }
    // 次のフレームへ
    requestAnimationFrame(predictLoop);
  }

  // アプリ起動
  async function main() {
    await startCamera();
    try {
      // AIモデルのロード
      model = await cocoSsd.load();
    } catch (e) {
      console.error("AIモデル読み込みエラー", e);
    }
    // ループ開始
    predictLoop();
  }

  // ページ読み込み時に実行
  window.onload = main;
</script>

</body>
</html>

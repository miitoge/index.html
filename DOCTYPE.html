<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Tracking</title>
  
  <!-- AIライブラリ（TensorFlow.js + COCO-SSD） -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 100vw; height: 100vh;
    }

    /* カメラ映像を全画面表示 */
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* トラッキング枠を描く透明キャンバス */
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="container">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<script>
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let model = null;

  // 1. カメラ起動（元コードのまま）
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" },
        audio: false
      });
      video.srcObject = stream;
      await new Promise((resolve) => { video.onloadeddata = () => resolve(); });
    } catch (e) {
      console.error("カメラの起動に失敗しました");
    }
  }

  // 2. リアルタイム追従（元コードから枠描画のみを残して削除）
  async function predictLoop() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    if (model && video.readyState === 4) {
      const predictions = await model.detect(video);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (predictions.length > 0) {
        const obj = predictions[0];
        
        // 座標変換
        const scaleX = canvas.width / video.videoWidth;
        const scaleY = canvas.height / video.videoHeight;
        const x = obj.bbox[0] * scaleX;
        const y = obj.bbox[1] * scaleY;
        const w = obj.bbox[2] * scaleX;
        const h = obj.bbox[3] * scaleY;

        // --- 動くトラッキング枠（元コードのピンク＆シアン枠） ---
        ctx.strokeStyle = '#ff00ff';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, w, h);

        // AR角枠
        const len = 15;
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 4;
        // 左上
        ctx.beginPath(); ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
        // 右上
        ctx.beginPath(); ctx.moveTo(x + w - len, y); ctx.lineTo(x + w); ctx.lineTo(x + w, y + len); ctx.stroke();
        // 左下
        ctx.beginPath(); ctx.moveTo(x, y + h - len); ctx.lineTo(x, y + h); ctx.lineTo(x + len, y + h); ctx.stroke();
        // 右下
        ctx.beginPath(); ctx.moveTo(x + w - len, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - len); ctx.stroke();
      }
    }
    requestAnimationFrame(predictLoop);
  }

  // アプリ起動（元コードのまま）
  async function main() {
    await startCamera();
    try {
      model = await cocoSsd.load();
    } catch (e) {
      console.error("AIモデルの読み込みに失敗しました");
    }
    predictLoop();
  }

  window.onload = main;
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Tracking</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 100vw; height: 100vh;
    }

    /* 全画面カメラ映像 */
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* トラッキング枠を描く透明キャンバス */
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    /* 最小限のステータス表示 */
    .status-bar {
      position: absolute;
      top: 15px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      color: #00ffcc;
      z-index: 10;
      border: 1px solid rgba(0, 255, 204, 0.5);
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="container">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div class="status-bar" id="status">📷 バーコードにかざしてください</div>
</div>

<script>
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');

  let barcodeDetector = null;

  // 1. カメラ起動
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" },
        audio: false
      });
      video.srcObject = stream;
      await new Promise((resolve) => { video.onloadeddata = () => resolve(); });
    } catch (e) {
      statusEl.innerText = "❌ カメラ起動失敗";
    }
  }

  // 2. リアルタイム追従（四角いトラッキング枠の描画のみ）
  async function scanLoop() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    if (barcodeDetector && video.readyState === 4) {
      try {
        const barcodes = await barcodeDetector.detect(video);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (barcodes.length > 0) {
          const code = barcodes[0];
          statusEl.innerText = "🎯 ターゲット追従中";

          // 座標・サイズ計算
          const scaleX = canvas.width / video.videoWidth;
          const scaleY = canvas.height / video.videoHeight;
          const x = code.boundingBox.x * scaleX;
          const y = code.boundingBox.y * scaleY;
          const w = code.boundingBox.width * scaleX;
          const h = code.boundingBox.height * scaleY;

          // --- 動くメイン枠（蛍光シアン） ---
          ctx.strokeStyle = '#00ffcc';
          ctx.lineWidth = 3;
          ctx.strokeRect(x, y, w, h);

          // --- AR角枠アクセント（蛍光ピンク） ---
          const len = 12;
          ctx.strokeStyle = '#ff00ff';
          ctx.lineWidth = 4;
          // 左上
          ctx.beginPath(); ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
          // 右上
          ctx.beginPath(); ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len); ctx.stroke();
          // 左下
          ctx.beginPath(); ctx.moveTo(x, y + h - len); ctx.lineTo(x, y + h); ctx.lineTo(x + len, y + h); ctx.stroke();
          // 右下
          ctx.beginPath(); ctx.moveTo(x + w - len, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - len); ctx.stroke();

        } else {
          statusEl.innerText = "🔍 バーコードにかざしてください";
        }
      } catch (e) {
        console.error(e);
      }
    }
    requestAnimationFrame(scanLoop);
  }

  // 起動処理
  async function main() {
    await startCamera();
    if ('BarcodeDetector' in window) {
      barcodeDetector = new BarcodeDetector({ formats: ['javascript', 'ean_13', 'ean_8', 'qr_code'] });
    } else {
      statusEl.innerText = "⚠️ 非対応ブラウザです";
    }
    scanLoop();
  }

  window.onload = main;
</script>

</body>
</html>

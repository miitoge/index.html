<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Object Tracking Shopping</title>
  
  <!-- TensorFlow.js と COCO-SSD (リアルタイム物体検出ライブラリ) の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <style>
    body {
      margin: 0; padding: 0;
      background: #000; color: white;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
    }

    /* カメラ映像 */
    .container {
      position: relative;
      width: 100vw; height: 100vh;
    }

    video {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* リアルタイム追従用キャンバス */
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* ステータス表示バー */
    .status-bar {
      position: absolute;
      top: 15px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: #00ffcc;
      z-index: 20;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 255, 204, 0.3);
    }

    /* ARオーバーレイ（最初のモックアップ画像風レイアウト） */
    .ar-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
      display: none; /* トラッキング時に表示 */
    }

    /* 左側：口コミパネル */
    .review-panel {
      position: absolute;
      top: 80px; left: 10px;
      width: 42%;
      max-height: 60vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 10px;
      box-sizing: border-box;
      font-size: 11px;
      overflow-y: auto;
      pointer-events: auto;
    }
    .review-panel h3 { margin: 0 0 6px 0; font-size: 13px; color: #fff; border-bottom: 1px solid #444; padding-bottom: 4px; }
    .pos-title { color: #4caf50; font-weight: bold; margin-top: 4px; }
    .neg-title { color: #ff5252; font-weight: bold; margin-top: 8px; }
    .review-text { color: #ddd; margin: 2px 0 6px 0; line-height: 1.3; }

    /* 右側：商品情報・比較パネル */
    .info-panel {
      position: absolute;
      top: 80px; right: 10px;
      width: 48%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 10px;
      box-sizing: border-box;
      pointer-events: auto;
    }
    .prod-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
    .prod-name { font-size: 13px; font-weight: bold; margin: 0; }
    .stars { color: #ffd700; font-size: 10px; }

    .compare-title { font-size: 11px; color: #ccc; margin: 6px 0 4px 0; }
    .compare-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .compare-card {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      padding: 4px 6px;
      font-size: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .compare-card.active { border-color: #ff00ff; background: rgba(255, 0, 255, 0.15); }

    /* レスポンシブ調整（小さめのスマホ画面用） */
    @media (max-width: 380px) {
      .review-panel, .info-panel { font-size: 10px; padding: 6px; }
      .prod-name { font-size: 11px; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- カメラ映像 -->
  <video id="webcam" autoplay playsinline muted></video>
  
  <!-- トラッキング枠を描画するキャンバス -->
  <canvas id="tracker-canvas"></canvas>

  <!-- ステータス表示 -->
  <div class="status-bar" id="status-text">AIモデル読み込み中...</div>

  <!-- 最初に見せていただいたモックアップ風オーバーレイUI -->
  <div class="ar-overlay" id="ar-overlay">
    <!-- 左：口コミ -->
    <div class="review-panel">
      <h3>▼ 口コミ</h3>
      <div class="pos-title">★ 肯定的なレビュー</div>
      <p class="review-text" id="pos-review">一口サイズで食べやすい！サクサクで美味しい。</p>
      
      <div class="neg-title">☆ 否定的なレビュー</div>
      <p class="review-text" id="neg-review">少しパサつきが気になるかも。</p>
    </div>

    <!-- 右：比較・詳細 -->
    <div class="info-panel">
      <div class="prod-header">
        <h2 class="prod-name" id="prod-name">チョコあ～んぱん</h2>
        <div class="stars">★★★★★</div>
      </div>

      <div class="compare-title">▼ 比較を選択</div>
      <div class="compare-list" id="compare-list">
        <div class="compare-card active">
          <span>チョコあ～んぱん</span>
          <b>¥108</b>
        </div>
        <div class="compare-card">
          <span>たけのこの里</span>
          <b>¥200</b>
        </div>
        <div class="compare-card">
          <span>コアラのマーチ</span>
          <b>¥120</b>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('tracker-canvas');
  const ctx = canvas.getContext('2d');
  const statusText = document.getElementById('status-text');
  const arOverlay = document.getElementById('ar-overlay');

  let model = null;

  // 1. カメラのセットアップ
  async function setupCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      return new Promise((resolve) => {
        video.onloadedmetadata = () => { resolve(video); };
      });
    } catch (err) {
      statusText.innerText = "カメラの起動に失敗しました";
      console.error(err);
    }
  }

  // 2. 物体認識・トラッキングループ
  async function detectObjects() {
    // 画面サイズにキャンバスを合わせる
    canvas.width = video.clientWidth;
    canvas.height = video.clientHeight;

    // AIでカメラ映像内の物体を検出
    const predictions = await model.detect(video);

    // キャンバスをクリア
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (predictions.length > 0) {
      statusText.innerText = "🎯 ターゲット検出・追従中";
      arOverlay.style.display = "block"; // オーバーレイUIを表示

      // 最も確信度が高い物体をメインターゲットにする
      const primary = predictions[0];
      
      // 映像の比率に合わせてバウンディングボックスの座標を変換
      const scaleX = canvas.width / video.videoWidth;
      const scaleY = canvas.height / video.videoHeight;

      const x = primary.bbox[0] * scaleX;
      const y = primary.bbox[1] * scaleY;
      const width = primary.bbox[2] * scaleX;
      const height = primary.bbox[3] * scaleY;

      // --- 四角いトラッキング枠（ピンクの蛍光枠）の描画 ---
      ctx.strokeStyle = '#ff00ff';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#ff00ff';
      ctx.shadowBlur = 10;
      ctx.strokeRect(x, y, width, height);

      // 角のアクセントを描画（AR風演出）
      const cornerLength = 15;
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 5;
      // 左上角
      ctx.beginPath(); ctx.moveTo(x, y + cornerLength); ctx.lineTo(x, y); ctx.lineTo(x + cornerLength, y); ctx.stroke();
      // 右上角
      ctx.beginPath(); ctx.moveTo(x + width - cornerLength, y); ctx.lineTo(x + width, y); ctx.lineTo(x + width, y + cornerLength); ctx.stroke();
      // 左下角
      ctx.beginPath(); ctx.moveTo(x, y + height - cornerLength); ctx.lineTo(x, y + height); ctx.lineTo(x + cornerLength, y + height); ctx.stroke();
      // 右下角
      ctx.beginPath(); ctx.moveTo(x + width - cornerLength, y + height); ctx.lineTo(x + width, y + height); ctx.lineTo(x + width, y + height - cornerLength); ctx.stroke();

      // 検出したモノに合わせてテキストを更新（※例: bottle, cup, book等）
      updateUIData(primary.class);

    } else {
      statusText.innerText = "🔍 カメラにモノ（お菓子、ボトル等）を映してください";
      // 検出されないときは枠とUIを非表示
      arOverlay.style.display = "none";
    }

    // 次のフレームで再検出（ループ）
    requestAnimationFrame(detectObjects);
  }

  // 3. 検出されたモノのラベルに応じて表示UIを書き換える
  function updateUIData(detectedClass) {
    const nameEl = document.getElementById('prod-name');
    const posEl = document.getElementById('pos-review');
    const negEl = document.getElementById('neg-review');

    // 検出されたオブジェクト名に応じてデータを疑似切り替え
    if (detectedClass === 'bottle' || detectedClass === 'cup') {
      nameEl.innerText = "コカ・コーラ 500ml";
      posEl.innerText = "炭酸が強くてリフレッシュに最高！";
      negEl.innerText = "糖分が多いので飲みすぎ注意。";
    } else if (detectedClass === 'cell phone' || detectedClass === 'book') {
      nameEl.innerText = "チョコあ～んぱん";
      posEl.innerText = "一口サイズで食べやすい！サクサクで美味しい。";
      negEl.innerText = "少しパサつきが気になるかも。";
    } else {
      nameEl.innerText = detectedClass.toUpperCase() + " (検出物)";
      posEl.innerText = "高評価：使い勝手が良く満足度が高い製品です。";
      negEl.innerText = "低評価：やや価格が高いと感じる人がいるようです。";
    }
  }

  // 4. アプリ起動処理
  async function init() {
    await setupCamera();
    statusText.innerText = "AIモデル（COCO-SSD）を起動中...";
    // TensorFlow物体検出モデルのロード
    model = await cocoSsd.load();
    statusText.innerText = "🔍 カメラにモノを映してください";
    detectObjects();
  }

  window.onload = init;
</script>

</body>
</html>
